<script type="module">
const stage = document.querySelector('three-d-stage');
const { THREE } = await stage.ready;

const W = 7.30, D = 8.78, H = 2.75, T = 0.10;
const apt = new THREE.Group();
apt.name = 'can_ho_2PN_cong_63m2';

function texHerringbone(){
  const P = 1024, Wc = 64, k = 4, N = P / Wc;   // ô rộng 64px, ván dài 4 ô → chu kỳ 8 ô = 512px, chia hết 1024
  const c = document.createElement('canvas');
  c.width = c.height = P;
  const g = c.getContext('2d');
  g.fillStyle = '#a9865f'; g.fillRect(0, 0, P, P);
  const tones = ['#be9a72'];
  const hash = () => 0;

  function plank(x, y, w, h, tone){
    g.fillStyle = tones[tone];
    g.fillRect(x, y, w, h);
    g.strokeStyle = 'rgba(96,68,42,0.45)'; g.lineWidth = 2;
    g.strokeRect(x + 1, y + 1, w - 2, h - 2);
    g.save();
    g.beginPath(); g.rect(x, y, w, h); g.clip();
    g.globalAlpha = 0.15; g.strokeStyle = '#8a6440'; g.lineWidth = 1.4;
    const along = w > h;
    for (let s = 1; s <= 3; s++){
      g.beginPath();
      if (along){ const yy = y + (h * s) / 4; g.moveTo(x + 6, yy); g.lineTo(x + w - 6, yy + 2); }
      else { const xx = x + (w * s) / 4; g.moveTo(xx, y + 6); g.lineTo(xx + 2, y + h - 6); }
      g.stroke();
    }
    g.restore();
  }

  const m = ((v, n) => ((v % n) + n) % n);
  for (let j = -k; j <= N + k; j++){
    for (let i = -k; i <= N + k; i++){
      const s = m(i + j, 2 * k);
      if (s === 0)       plank(i * Wc, j * Wc, k * Wc, Wc, hash(i, j, 1));       // ván ngang
      else if (s === k)  plank(i * Wc, j * Wc, Wc, k * Wc, hash(i, j, 2));       // ván dọc
    }
  }

  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.center.set(0.5, 0.5);
  t.rotation = Math.PI / 4;          // xoay 45° → xương cá chéo
  t.repeat.set(5, 6);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}

function texGachXam(){
  const P = 1024, c = document.createElement('canvas');
  c.width = c.height = P;
  const g = c.getContext('2d');
  const TW = P / 2, TH = P / 2;              // viên vuông 60×60 cm, lát thẳng hàng
  g.fillStyle = '#494340'; g.fillRect(0, 0, P, P);
  for (let r = 0; r < 2; r++){
    for (let i = 0; i <= 1; i++){
      const x = i * TW, y = r * TH;
      g.fillStyle = '#a3998f';
      g.fillRect(x + 5, y + 5, TW - 10, TH - 10);
      g.save();
      g.beginPath(); g.rect(x + 5, y + 5, TW - 10, TH - 10); g.clip();
      for (let n = 0; n < 24; n++){
        const cx = x + Math.random() * TW, cy = y + Math.random() * TH;
        const rr = 22 + Math.random() * 38;
        const grd = g.createRadialGradient(cx, cy, 0, cx, cy, rr);
        const dark = Math.random() > 0.5;
        grd.addColorStop(0, dark ? 'rgba(126,116,108,0.13)' : 'rgba(196,188,180,0.12)');
        grd.addColorStop(1, 'rgba(0,0,0,0)');
        g.fillStyle = grd;
        g.beginPath(); g.arc(cx, cy, rr, 0, Math.PI * 2); g.fill();
      }
      g.restore();
    }
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(2.54, 2.46);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}

const M = {
  plaster:  new THREE.MeshStandardMaterial({ name:'plaster',   color:0xeceae5, roughness:0.95 }),
  oak:      new THREE.MeshStandardMaterial({ name:'oak_herringbone', color:0xffffff, map: texHerringbone(), roughness:0.62 }),
  tile:     new THREE.MeshStandardMaterial({ name:'tile',      color:0xb3ada4, roughness:0.55 }),
  walnut:   new THREE.MeshStandardMaterial({ name:'walnut',    color:0x6b4a32, roughness:0.6 }),
  ash:      new THREE.MeshStandardMaterial({ name:'ash_wood',  color:0xbe9a72, roughness:0.68 }),
  linen:    new THREE.MeshStandardMaterial({ name:'linen',     color:0xc3bbad, roughness:0.9 }),
  cream:    new THREE.MeshStandardMaterial({ name:'cream',     color:0xe4dccd, roughness:0.85 }),
  charcoal: new THREE.MeshStandardMaterial({ name:'charcoal',  color:0x3a3835, roughness:0.75 }),
  marble:   new THREE.MeshStandardMaterial({ name:'marble',    color:0xe9e5dd, roughness:0.35 }),
  brass:    new THREE.MeshStandardMaterial({ name:'brass',     color:0xb68235, roughness:0.35, metalness:0.35 }),
  glass:    new THREE.MeshStandardMaterial({ name:'glass',     color:0xd7e2e2, roughness:0.08, transparent:true, opacity:0.22 }),
  white:    new THREE.MeshStandardMaterial({ name:'porcelain', color:0xf7f6f3, roughness:0.25 }),
  green:    new THREE.MeshStandardMaterial({ name:'foliage',   color:0x7d8c6d, roughness:0.9 }),
  kinh_mo:  new THREE.MeshStandardMaterial({ name:'frosted_glass', color:0xdcdcd6, roughness:0.85, transparent:true, opacity:0.62 }),
  bep_xam:  new THREE.MeshStandardMaterial({ name:'matte_grey_cabinet', color:0x565351, roughness:0.72 }),
  inox:     new THREE.MeshStandardMaterial({ name:'stainless', color:0xb9bcbd, roughness:0.28, metalness:0.55 }),
  gach_bong: new THREE.MeshStandardMaterial({ name:'patterned_tile', color:0xdad6cd, roughness:0.42 }),
  den_led:  new THREE.MeshStandardMaterial({ name:'led_warm', color:0xfff0d4, emissive:0xffe6b8, emissiveIntensity:0.85, roughness:0.4 }),
  gach_bep: new THREE.MeshStandardMaterial({ name:'grey_concrete_tile', color:0xffffff, map: texGachXam(), roughness:0.5 }),
};

function bx(name, mat, x0,x1, y0,y1, z0,z1){
  const m = new THREE.Mesh(new THREE.BoxGeometry(x1-x0, y1-y0, z1-z0), mat);
  m.name = name;
  m.position.set((x0+x1)/2, (y0+y1)/2, (z0+z1)/2);
  m.castShadow = m.receiveShadow = true;
  apt.add(m); return m;
}
function cyl(name, mat, r, h, x,y,z, rs=28){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, rs), mat);
  m.name = name; m.position.set(x, y+h/2, z);
  m.castShadow = m.receiveShadow = true;
  apt.add(m); return m;
}
function blob(name, mat, r, x,y,z, sy=0.85){
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, 22, 15), mat);
  m.name = name; m.position.set(x, y, z); m.scale.set(1, sy, 1);
  m.castShadow = true; apt.add(m); return m;
}
// tường có lỗ mở: axis 'x' (chạy theo x, dày theo z) hoặc 'z'
function wall(name, axis, a0,a1, p0,p1, openings=[], h=H, mat=M.plaster){
  const ops = [...openings].sort((u,v)=>u.a0-v.a0);
  const parts = []; let cur = a0;
  for (const o of ops){
    if (o.a0 > cur) parts.push([cur, o.a0, 0, h]);
    if (o.y0 > 0)   parts.push([o.a0, o.a1, 0, o.y0]);
    if (o.y1 < h)   parts.push([o.a0, o.a1, o.y1, h]);
    cur = o.a1;
  }
  if (cur < a1) parts.push([cur, a1, 0, h]);
  parts.forEach(([s,e,y0,y1], i) => {
    if (axis === 'x') bx(`${name}_${i}`, mat, s,e, y0,y1, p0,p1);
    else              bx(`${name}_${i}`, mat, p0,p1, y0,y1, s,e);
  });
}


/* ============ SÀN ============ */
bx('san_be_tong', M.tile, -T, W+T, -0.16, -0.02, -T, D+T);
bx('san_go',        M.oak,  0, W, -0.02, 0.0, 0, D);
bx('san_gach_bep',  M.gach_bep, 0, 3.05, -0.02, 0.012, 0, 2.95);
bx('san_gach_wc1',  M.tile, 0, 3.05, -0.02, 0.012, 3.05, 4.35);
bx('san_gach_wc2',  M.tile, 0, 3.05, -0.02, 0.012, 4.45, 5.90);
bx('san_gach_logia',M.tile, 6.15, W,  -0.02, 0.012, 0, 3.20);

/* ============ TƯỜNG BAO ============ */
// cạnh trên z = 0: cửa vào (góc trái) + logia (phải)
wall('tuong_tren', 'x', 0, 6.15, -T, 0, [{a0:0.70, a1:1.70, y0:0, y1:2.15}]);
bx('cua_chinh', M.walnut, 0.72, 1.68, 0.01, 2.13, -0.08, -0.02);
bx('cua_chinh_tay_nam', M.brass, 1.54, 1.60, 1.02, 1.08, -0.14, -0.06);

// cạnh trái x = 0: cửa sổ bếp + cửa sổ PN1
wall('tuong_trai', 'z', -T, D+T, -T, 0);
bx('kinh_pnlon_phai', M.glass, W+0.02, W+0.06, 0.04, 2.43, 5.80, 8.58);
bx('do_kinh_pnlon_a', M.charcoal, W+0.01, W+0.07, 0.04, 2.43, 6.82, 6.88);
bx('do_kinh_pnlon_b', M.charcoal, W+0.01, W+0.07, 0.04, 2.43, 7.70, 7.76);
bx('rem_pnlon_goc', M.linen, W-0.30, W-0.06, 0.02, 2.60, 5.86, 6.24);
bx('rem_pnlon_cuoi', M.linen, W-0.30, W-0.06, 0.02, 2.60, 8.14, 8.52);
bx('thanh_rem_pnlon', M.charcoal, W-0.26, W-0.20, 2.60, 2.66, 5.80, 8.58);
bx('rem_khach_t', M.linen, W-0.30, W-0.06, 0.02, 2.60, 3.46, 3.84);
bx('rem_khach_p', M.linen, W-0.30, W-0.06, 0.02, 2.60, 5.28, 5.66);
bx('thanh_rem_khach', M.charcoal, W-0.26, W-0.20, 2.60, 2.66, 3.42, 5.70);
bx('rem_ban_cong', M.linen, 6.04, 6.10, 0.02, 2.60, 0.40, 0.78);
bx('thanh_rem_ban_cong', M.charcoal, 6.03, 6.11, 2.60, 2.66, 0.34, 2.58);

// cạnh phải x = W: lan can logia + cửa sổ phòng khách
wall('tuong_phai', 'z', 3.20, D+T, W, W+T, [
  {a0:3.40, a1:8.60, y0:0.02, y1:2.45},
]);
bx('kinh_khach_phai', M.glass, W+0.02, W+0.06, 0.04, 2.43, 3.42, 5.70);
bx('do_kinh_khach', M.charcoal, W+0.01, W+0.07, 0.04, 2.43, 4.52, 4.58);
bx('lan_can_logia_phai_be',  M.plaster, W, W+T, 0, 0.22, -T, 3.20);
for (let i = 0; i < 22; i++){
  const z0 = -0.02 + i * 0.145;
  bx('song_sat_bc_phai_' + i, M.charcoal, W+0.05, W+0.076, 0.22, 1.05, z0, z0 + 0.026);
}
bx('lan_can_logia_phai_vin', M.charcoal, W-0.02, W+0.12, 1.05, 1.10, -T, 3.20);

// cạnh dưới z = D: cửa sổ 2 phòng ngủ
wall('tuong_duoi', 'x', 0, W, D, D+T, [
  {a0:0.60, a1:2.60, y0:0.02, y1:2.45},
  {a0:3.15, a1:4.25, y0:0.02, y1:H},
]);
bx('kinh_pnnho_duoi', M.glass, 0.62, 2.58, 0.04, 2.43, D+0.02, D+0.06);
bx('do_kinh_pnnho', M.charcoal, 1.57, 1.63, 0.04, 2.43, D+0.01, D+0.07);
bx('rem_pnnho_t', M.linen, 0.66, 1.02, 0.02, 2.60, D-0.30, D-0.06);
bx('rem_pnnho_p', M.linen, 2.18, 2.54, 0.02, 2.60, D-0.30, D-0.06);
bx('thanh_rem_pnnho', M.charcoal, 0.58, 2.62, 2.60, 2.66, D-0.26, D-0.20);

/* ---- logia giữa (cuối hành lang, giữa 2 phòng ngủ) ---- */
bx('san_logia_giua', M.tile, 3.15, 4.25, -0.02, 0.012, 7.30, D);
wall('vach_logia_giua', 'x', 3.15, 4.25, 7.26, 7.32, [{a0:3.28, a1:4.14, y0:0.02, y1:2.30}]);
bx('kinh_cua_logia_giua', M.glass, 3.30, 4.12, 0.04, 2.28, 7.27, 7.31);
bx('do_cua_logia_giua', M.charcoal, 3.68, 3.74, 0.04, 2.28, 7.26, 7.32);
bx('lan_can_giua_be',  M.plaster, 3.15, 4.25, 0, 0.22, D, D+T);
for (let i = 0; i < 8; i++){
  const x0 = 3.22 + i * 0.135;
  bx('song_sat_logia_' + i, M.charcoal, x0, x0 + 0.026, 0.22, 1.05, D + 0.02, D + 0.05);
}
bx('lan_can_giua_vin',   M.charcoal, 3.13, 4.27, 1.05, 1.10, D - 0.01, D + 0.08);
bx('may_giat', M.white, 3.30, 3.95, 0.02, 0.86, 8.05, 8.70);
bx('may_giat_cua', M.charcoal, 3.42, 3.83, 0.35, 0.70, 8.01, 8.05);
bx('ke_giat_da', M.marble, 3.98, 4.24, 0.85, 0.90, 7.95, D);
cyl('chau_cay_logia_giua', M.tile, 0.15, 0.26, 4.10, 0.0, 7.60, 18);
blob('tan_cay_logia_giua', M.green, 0.24, 4.10, 0.52, 7.60);

/* ============ VÁCH TRONG ============ */
// vách kính ra logia
wall('vach_logia', 'z', -T, 3.30, 6.15, 6.21, [{a0:0.35, a1:2.55, y0:0.02, y1:2.30}]);
bx('kinh_cua_logia', M.glass, 6.16, 6.20, 0.04, 2.28, 0.37, 2.53);
bx('do_cua_logia', M.charcoal, 6.15, 6.21, 0.04, 2.28, 1.43, 1.49);

// ốp than tre mảng tường nhỏ cạnh cửa logia (sau tựa ghế bệt)
[[0.02, 0.35], [2.55, 3.30]].forEach(([z0, z1], k) => {
  bx('op_tre_canh_logia_' + k, M.ash, 6.134, 6.150, 0.0, H, z0, z1);
  bx('op_tre_canh_logia_len_' + k, M.charcoal, 6.124, 6.134, 0.0, 0.08, z0, z1);
  const n = Math.max(1, Math.round((z1 - z0) / 0.436));
  for (let i = 1; i < n; i++){
    const zz = z0 + i * ((z1 - z0) / n);
    bx('khe_op_tre_logia_' + k + '_' + i, M.charcoal, 6.130, 6.134, 0.08, H, zz - 0.005, zz + 0.005);
  }
  bx('khe_op_tre_logia_ngang_' + k, M.charcoal, 6.130, 6.134, 2.12, 2.128, z0, z1);
});
bx('tuong_ban_cong_cuoi', M.plaster, 6.15, W+T, 0, H, 3.20, 3.30);
// ốp than tre mảng tường nhỏ đối diện tivi
bx('op_tre_doi_dien', M.ash, 6.15, W, 0.0, H, 3.300, 3.316);
bx('op_tre_doi_dien_len', M.charcoal, 6.15, W, 0.0, 0.08, 3.316, 3.326);
for (let i = 1; i < 3; i++){
  const x0 = 6.15 + i * ((W - 6.15) / 3);
  bx('khe_op_tre_dd_' + i, M.charcoal, x0 - 0.005, x0 + 0.005, 0.08, H, 3.316, 3.320);
}
bx('khe_op_tre_dd_ngang', M.charcoal, 6.15, W, 2.12, 2.128, 3.316, 3.320);

// khối WC + bếp ngăn với hành lang
wall('vach_bep_wc', 'x', 0, 3.15, 2.95, 3.05);
wall('vach_hanh_lang', 'z', 2.95, 6.00, 3.05, 3.15, [
  {a0:3.45, a1:4.15, y0:0, y1:2.15},
  {a0:4.80, a1:5.50, y0:0, y1:2.15},
]);
function cua_wc(name, z0, z1){
  const f = 0.05;
  bx(name+'_khung_t', M.plaster, 3.04, 3.14, 0.0, 2.15, z0-f, z0);
  bx(name+'_khung_p', M.plaster, 3.04, 3.14, 0.0, 2.15, z1, z1+f);
  bx(name+'_khung_tren', M.plaster, 3.04, 3.14, 2.15, 2.15+f, z0-f, z1+f);
  bx(name+'_canh_duoi', M.plaster, 3.06, 3.12, 0.01, 1.02, z0, z1);
  bx(name+'_no_giua',   M.plaster, 3.06, 3.12, 1.02, 1.10, z0, z1);
  bx(name+'_kinh_mo',   M.kinh_mo, 3.07, 3.11, 1.10, 2.06, z0+0.05, z1-0.05);
  bx(name+'_no_tren',   M.plaster, 3.06, 3.12, 2.06, 2.13, z0, z1);
  bx(name+'_no_bien_t', M.plaster, 3.06, 3.12, 1.10, 2.06, z0, z0+0.05);
  bx(name+'_no_bien_p', M.plaster, 3.06, 3.12, 1.10, 2.06, z1-0.05, z1);
  bx(name+'_tay_nam',   M.brass,   3.02, 3.06, 1.02, 1.08, z1-0.16, z1-0.10);
}
cua_wc('cua_wc1', 3.47, 4.13);
cua_wc('cua_wc2', 4.82, 5.48);
wall('vach_giua_2wc', 'x', 0, 3.15, 4.35, 4.45);
